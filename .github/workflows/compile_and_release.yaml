name: Compile and check BEBI thesis template

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out template
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile draft and test template modes
        uses: xu-cheng/latex-action@v4
        with:
          root_file: main.tex
          texlive_version: 2026
          os: debian
          latexmk_use_xelatex: true
          extra_system_packages: python3 python3-venv
          post_compile: |
            python3 -m venv /tmp/bebi-template-check
            /tmp/bebi-template-check/bin/pip install --disable-pip-version-check pypdf==6.10.0
            /tmp/bebi-template-check/bin/python scripts/check_template.py
      - name: Upload draft preview
        uses: actions/upload-artifact@v4
        with:
          name: bebi-thesis-draft-preview
          path: main.pdf
          if-no-files-found: error
          retention-days: 7
